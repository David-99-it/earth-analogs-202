{% verbatim %}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NASA Локатор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>

:root{--bg:#10141b;--panel:#171d27;--line:#2a3342;--text:#e9e5da;--mute:#9aa3b2;--ice:#86d9e8;--dust:#d8c9a8;--land:#33404f;--bd:#4a5a6e;--ocean:#0c1826;--ink:#0b1016;
--h:'Unbounded','Trebuchet MS',system-ui,sans-serif;--b:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ea;--panel:#fff;--line:#d9d4c6;--text:#1c2430;--mute:#5d6676;--ice:#0f6f84;--dust:#7a5f23;--land:#efe9d8;--bd:#c9c1ab;--ocean:#cfe3ee;--ink:#fff;color-scheme:light}}
:root[data-theme="dark"]{--bg:#10141b;--panel:#171d27;--line:#2a3342;--text:#e9e5da;--mute:#9aa3b2;--ice:#86d9e8;--dust:#d8c9a8;--land:#33404f;--bd:#4a5a6e;--ocean:#0c1826;--ink:#0b1016}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.5 var(--b)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:-1}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px}
.brand{font:700 17px var(--h)}
.lead{color:var(--mute);max-width:78ch;margin:16px 0 14px}
.app{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);grid-template-areas:"g s" "r s";gap:16px;padding-bottom:20px}
.g1{grid-area:g}.g2{grid-area:r}.side{grid-area:s;display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 84px);overflow:auto;padding-bottom:4px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font:500 14.5px var(--h);margin:0 0 10px;color:var(--dust)}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,.btn,.ic{background:transparent;border:1px solid var(--line);color:var(--mute);padding:7px 13px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ice);border-color:var(--ice);color:var(--ink);font-weight:600}
.btn{color:var(--ice);border-color:var(--ice)}
.btn-prim{background:var(--ice);color:var(--ink);font-weight:600}
.ic{width:38px;height:38px;padding:0;font-size:18px;background:var(--panel);color:var(--text)}
.ic[aria-pressed="true"]{color:var(--ice);border-color:var(--ice)}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.gw{position:relative;padding:0;overflow:hidden}
canvas{width:100%;height:clamp(360px,66vh,640px);display:block;cursor:grab;touch-action:none;background:var(--bg)}
canvas:active{cursor:grabbing}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 60px)}
.tools .chip{background:var(--panel)}.tools .chip[aria-pressed="true"]{background:var(--ice)}
.zs{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--ice);border-radius:12px;padding:10px 12px;font-size:12.5px;display:none;width:320px;box-shadow:0 10px 28px rgba(0,0,0,.7);z-index:99;line-height:1.35}
.tip-section{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:6px}
.tip-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.tip-img{width:100%;height:95px;object-fit:cover;border-radius:6px;margin-top:5px;display:block}
.hint{padding:8px 14px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search],.nm,.fi,textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font:inherit}
input[type=search]{flex:1 1 180px}.nm{width:72px;text-align:center}
.list{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow:auto;margin-top:12px}
.it{display:grid;grid-template-columns:1fr 48px;gap:2px 10px;text-align:left;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.it[aria-pressed="true"]{border-color:var(--ice);background:rgba(134,217,232,.09)}
.it small{color:var(--mute);grid-column:1}.it b{grid-row:1/3;grid-column:2;align-self:center;text-align:right;color:var(--ice);font:500 16px var(--h)}
.bb{height:4px;border-radius:2px;background:var(--line);grid-column:1/3}.bb i{display:block;height:100%;background:var(--ice);border-radius:2px}
.sim{font:700 34px var(--h);color:var(--ice);line-height:1.1}
.tag{display:inline-block;font:500 12px var(--b);border:1px solid var(--dust);color:var(--dust);border-radius:99px;padding:1px 9px;margin-left:8px;vertical-align:middle}
.warn{border-left:3px solid var(--dust);padding:2px 0 2px 12px;color:var(--mute);margin:10px 0 0}
.leg{font-size:12.5px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
svg text{fill:var(--mute);font:11px var(--b)}
.pr{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center;font-size:13.5px;color:var(--mute);padding:3px 0}
.pr.hd{font-size:12.5px}
.cl{display:flex;gap:6px;align-items:center}.cl input{width:100%;min-width:0;accent-color:var(--ice)}.cl output{width:16px;text-align:right;color:var(--text)}
.csec{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.csh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px;font-weight:600;color:var(--dust)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cg3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;transition:border-color .15s}
.fl:focus-within{border-color:var(--ice)}
.fl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-height:32px}
.fi{width:100%}
.fl .fi{border:none;border-top:1px solid var(--line);border-radius:0;padding:6px 0 0;margin-top:4px;background:transparent;font-weight:500}
.fl .fi:focus-visible{outline:none}
.scb{font-size:11.5px;font-weight:600;color:var(--ice);background:rgba(134,217,232,.14);padding:2px 7px;border-radius:6px;white-space:nowrap}
.sim-pill{border:1px solid var(--ice);background:rgba(134,217,232,.08);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--text)}
.sim-pill b{color:var(--ice);font-family:var(--h)}
.mu{color:var(--mute);font-size:14px;margin:0 0 6px}
.rc{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--mute)}.rc b{color:var(--text)}
details{margin:12px 0}.src a{color:var(--ice);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13.5px}
footer{border-top:1px solid var(--line);padding:18px 0 32px;color:var(--mute);font-size:13px}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-areas:"g" "s" "r"}.side{position:static;max-height:none;overflow:visible}canvas{height:clamp(320px,58vh,520px)}.tip{width:260px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Methodology and CSV workspace */
.method-panel,.csv-panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;margin:12px 0}
.method-panel summary,.csv-panel summary{cursor:pointer;list-style:none;font-weight:650;color:var(--ice);display:flex;align-items:center;gap:9px}
.method-panel summary::-webkit-details-marker,.csv-panel summary::-webkit-details-marker{display:none}
.method-panel summary:before,.csv-panel summary:before{content:"＋";display:grid;place-items:center;width:22px;height:22px;border:1px solid var(--line);border-radius:7px;font-size:14px}
.method-panel[open] summary:before,.csv-panel[open] summary:before{content:"−"}
.method-intro{margin:12px 0}
.formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.formula-grid>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:12.5px}
.formula-grid b{font-weight:550;color:var(--text)}
.formula-grid code{font-size:11.5px;color:var(--ice);white-space:nowrap}
.method-note{margin:12px 0 0;padding:9px 11px;border-left:2px solid var(--ice);background:rgba(134,217,232,.06);color:var(--mute);font-size:12px}
.csv-panel{margin-top:14px}
.csv-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.file-btn{position:relative;overflow:hidden;cursor:pointer}
.file-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.csv-label{display:block;margin:12px 0 6px;color:var(--text);font-size:12.5px;font-weight:600}
#csv{display:block;width:100%;min-height:116px;resize:vertical;line-height:1.55;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.csv-status{font-size:12px;color:var(--mute);flex:1 1 180px}
.csv-status.error{color:#f0a18e}.csv-status.success{color:#8bd9b1}
.csv-results{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.csv-result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.csv-result-head span{color:var(--mute);font-size:12px}
.csv-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}
.csv-table{width:100%;border-collapse:collapse;font-size:12px;min-width:440px}
.csv-table th,.csv-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.csv-table th{color:var(--mute);font-weight:550;background:var(--bg)}
.csv-table tr:last-child td{border-bottom:0}
.csv-score{color:var(--ice);font-weight:700;font-variant-numeric:tabular-nums}
.csv-ok{color:#8bd9b1}.csv-bad{color:#f0a18e}
@media(max-width:600px){.formula-grid>div{align-items:flex-start;flex-direction:column;gap:4px}.csv-actions .btn{flex:1 1 auto}}

</style>
</head>
<body>
<div class="top"><div class="wrap bar">
 <span class="brand" id="brand"></span>
 <div class="seg" id="tg"></div>
 <div class="seg" id="lg"><button class="chip" data-l="ru" aria-pressed="false">RU</button><button class="chip" data-l="en" aria-pressed="false">EN</button></div>
</div></div>
<div class="wrap">
<p class="lead" data-i="lead"></p>
<div class="app">
 <div class="box gw g1">
  <canvas id="map" tabindex="0" data-a="mapa"></canvas>
  <div class="tools"><button class="chip" id="vg" data-i="vg" aria-pressed="true"></button><button class="chip" id="vf" data-i="vf" aria-pressed="false"></button><button class="ic" id="sp" data-a="spin" aria-pressed="true">⟳</button></div>
  <div class="zs"><button class="ic" id="zi" data-a="zin">+</button><button class="ic" id="zo" data-a="zout">−</button><button class="ic" id="rs" data-a="rst">⌂</button></div>
  <div class="tip" id="tip"></div>
  <div class="hint"><span data-i="hint"></span> <span data-i="leg"></span></div>
 </div>
 <div class="side">
  <div class="box" id="det" aria-live="polite"></div>
  <div class="box"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0" data-i="params"></h2>
   <div class="seg"><button class="chip" id="ms" data-i="msl" aria-pressed="true"></button><button class="chip" id="mn" data-i="mnum" aria-pressed="false"></button></div></div><div id="prm"></div></div>
  <div class="box"><div class="row"><button class="btn" id="rep" data-i="rep"></button><span id="msg" style="font-size:13px;color:var(--mute)"></span></div></div>
 </div>
 <div class="box g2"><div class="row"><h2 style="margin:0" data-i="rank"></h2><input id="q" type="search" data-p="sph" data-a="sph"><button class="chip" id="lit" data-i="lit" aria-pressed="false"></button></div><div class="list" id="list"></div></div>
</div>
<div class="box src" id="calc" style="margin-bottom:22px">
  <h2 data-i="ct"></h2>
  <p class="mu" data-i="cp"></p>

  <div class="csec">
    <div class="csh"><span data-i="calcParams"></span></div>
    <div class="cg3">
      <label class="fl"><span data-i="cn"></span><input class="fi" id="cn" type="text" maxlength="60" data-p="cnph"></label>
      <label class="fl"><span data-i="cla"></span><input class="fi" id="cla" type="number" step="any" min="-90" max="90" placeholder="-90 … 90"></label>
      <label class="fl"><span data-i="clo"></span><input class="fi" id="clo" type="number" step="any" min="-180" max="180" placeholder="-180 … 180"></label>
    </div>
  </div>

  <div class="csec">
    <div class="csh">
      <span data-i="calcAdditional"></span>
      <div class="seg">
        <button class="chip" id="cmoon" data-i="cmoon"></button>
        <button class="chip" id="cmars" data-i="cmars"></button>
      </div>
    </div>
    <div class="cg">
      <label class="fl"><div class="fl-top"><span data-i="f1"></span><span class="scb" id="cb1">0.0 / 10</span></div><input class="fi cx" id="c1" type="number" step="any" min="0" max="100" placeholder="0 – 100"></label>
      <label class="fl"><div class="fl-top"><span data-i="f2"></span><span class="scb" id="cb2">0.0 / 10</span></div><input class="fi cx" id="c2" type="number" step="any" min="0" max="90" placeholder="0 – 90"></label>
      <label class="fl"><div class="fl-top"><span data-i="f3"></span><span class="scb" id="cb3">0.0 / 10</span></div><input class="fi cx" id="c3" type="number" step="any" min="0" max="600" placeholder="0 – 600"></label>
      <label class="fl"><div class="fl-top"><span data-i="f4"></span><span class="scb" id="cb4">0.0 / 10</span></div><input class="fi cx" id="c4" type="number" step="any" min="0" max="100" placeholder="0 – 100"></label>
      <label class="fl"><div class="fl-top"><span data-i="f5"></span><span class="scb" id="cb5">0.0 / 10</span></div><input class="fi cx" id="c5" type="number" step="any" min="0" max="100" placeholder="0 – 100"></label>
      <label class="fl"><div class="fl-top"><span data-i="f6"></span><span class="scb" id="cb6">0.0 / 10</span></div><input class="fi cx" id="c6" type="number" step="any" min="0" max="1000" placeholder="0 – 1000"></label>
      <label class="fl"><div class="fl-top"><span data-i="f7"></span><span class="scb" id="cb7">0.0 / 10</span></div><input class="fi cx" id="c7" type="number" step="any" min="0" max="365" placeholder="0 – 365"></label>
    </div>
  </div>

  <div class="row" style="margin:12px 0">
    <button class="btn btn-prim" id="cadd" data-i="cadd"></button>
    <button class="btn" id="cuse" data-i="cuse"></button>
    <span class="sim-pill" id="cres" aria-live="polite"></span>
    <span id="cmsg" style="font-size:13px;color:var(--mute)"></span>
  </div>

  <details class="method-panel">
    <summary data-i="cft"></summary>
    <p class="mu method-intro" data-i="cf"></p>
    <div class="formula-grid">
      <div><b data-i="fgeo"></b><code>x₁ ÷ 10</code></div><div><b data-i="frel"></b><code>x₂ × 0.7</code></div>
      <div><b data-i="ftemp"></b><code>x₃ ÷ 28</code></div><div><b data-i="fwater"></b><code>6.705 × log₁₀(1 + x₄)</code></div>
      <div><b data-i="fdust"></b><code>x₅ ÷ 10</code></div><div><b data-i="fcaves"></b><code>5 × log₁₀(1 + x₆)</code></div>
      <div><b data-i="flife"></b><code>x₇ ÷ 36.5</code></div>
    </div>
    <p class="method-note" data-i="fclamp"></p>
  </details>
  <details class="csv-panel" id="csvPanel">
    <summary data-i="csvt"></summary>
    <p class="mu" data-i="csvp"></p>
    <div class="csv-actions">
      <label class="btn file-btn" for="csvFile"><span data-i="csvUpload"></span><input id="csvFile" type="file" accept=".csv,text/csv"></label>
      <button class="btn" id="csvTemplate" type="button" data-i="csvTemplate"></button>
    </div>
    <label class="csv-label" for="csv" data-i="csvDataLabel"></label>
    <textarea id="csv" rows="5" spellcheck="false" data-p="csvPlaceholder"></textarea>
    <div class="row csv-actions">
      <button class="btn btn-prim" id="cimp" type="button" data-i="cimp"></button>
      <button class="btn" id="ccopy" type="button" data-i="ccopy"></button>
      <span id="csvStatus" class="csv-status" role="status" aria-live="polite"></span>
    </div>
    <div id="csvResults" class="csv-results" hidden>
      <div class="csv-result-head"><b data-i="csvResultsTitle"></b><span id="csvCount"></span></div>
      <div class="csv-table-wrap"><table class="csv-table">
        <thead><tr><th data-i="csvColName"></th><th data-i="csvColCoords"></th><th data-i="csvColScore"></th><th data-i="csvColStatus"></th></tr></thead>
        <tbody id="csvResultRows"></tbody>
      </table></div>
    </div>
  </details>

  <h2 style="margin-top:16px" data-i="srct"></h2>
  <p class="mu" data-i="srcp"></p>
  <div class="row" id="src"></div>
</div>
<footer data-i="foot"></footer>
</div>

function csvLine(line,delimiter){
    var out=[],value="",quoted=false;
    for(var i=0;i<line.length;i++){
        var ch=line[i];
        if(ch==='"'&&quoted&&line[i+1]==='"'){value+='"';i++}
        else if(ch==='"'){quoted=!quoted}
        else if(ch===delimiter&&!quoted){out.push(value.trim());value=""}
        else{value+=ch}
    }
    out.push(value.trim());return out;
}
function csvEscape(value){
    var x=String(value==null?"":value);
    return /[",;\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;
}
function esc(value){
    return String(value==null?"":value).replace(/[&<>"']/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]});
}
function setCsvStatus(message,kind){
    var el=$("csvStatus");el.textContent=message;el.className="csv-status"+(kind?" "+kind:"");

function parseCsvText(text){
    var lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(function(line){return line.trim()!==""});
    if(!lines.length)return{valid:[],errors:[]};
    var delimiter=lines[0].indexOf(";")>=0?";":",",valid=[],errors=[];
    lines.forEach(function(line,index){
        var fields=csvLine(line,delimiter);
        if(index===0&&/^(name|название|site|участок)/i.test(fields[0]))return;
        if(fields.length!==10){errors.push({name:fields[0],reason:t("csvRowError")});return}
        var nums=fields.slice(1).map(function(v){return v===""?NaN:Number(v)});
        var limits=[[-90,90],[-180,180],[0,100],[0,90],[0,600],[0,100],[0,100],[0,1000],[0,365]];
        var invalid=nums.some(function(v,i){return !Number.isFinite(v)||v<limits[i][0]||v>limits[i][1]});
        if(invalid){errors.push({name:fields[0],reason:t("csvRowError")});return}
        valid.push([fields[0]||((lang==="ru"?"Участок ":"Site ")+(valid.length+1)),nums[0],nums[1],nums.slice(2)]);
    });
    return{valid:valid,errors:errors};
}
function renderCsvResults(items,errors){

    });
    errors.forEach(function(err){
        html+='<tr><td>'+esc(err.name||"—")+'</td><td>—</td><td>—</td><td class="csv-bad">'+esc(err.reason)+'</td></tr>';

}
